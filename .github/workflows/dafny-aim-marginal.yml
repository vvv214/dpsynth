name: Dafny AIM marginal pilot

on:
  push:
    branches:
      - experiment/dafny-aim-marginal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-translate-run:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out experiment branch
        uses: actions/checkout@v4

      - name: Install Dafny 4.11.0
        uses: dafny-lang/setup-dafny-action@v1
        with:
          dafny-version: "4.11.0"

      - name: Record tool versions
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p formal/aim_single_marginal/artifacts
          dafny --version | tee formal/aim_single_marginal/artifacts/dafny-version.txt
          python3 --version 2>&1 | tee formal/aim_single_marginal/artifacts/python-version.txt

      - name: Verify Dafny proof
        shell: bash
        run: |
          set -o pipefail
          dafny verify formal/aim_single_marginal/AimSingleMarginal.dfy \
            | tee formal/aim_single_marginal/artifacts/verify.log

      - name: Translate verified program to Python
        shell: bash
        run: |
          set -euxo pipefail
          dafny translate py \
            formal/aim_single_marginal/AimSingleMarginal.dfy \
            --output=formal/aim_single_marginal/artifacts/aim_marginal \
            --include-runtime \
            | tee formal/aim_single_marginal/artifacts/translate.log
          find formal/aim_single_marginal/artifacts/aim_marginal-py \
            -maxdepth 3 -type f -print | sort \
            | tee formal/aim_single_marginal/artifacts/generated-files.txt

      - name: Execute generated Python
        shell: bash
        run: |
          set -euxo pipefail
          python3 formal/aim_single_marginal/artifacts/aim_marginal-py/ \
            | tee formal/aim_single_marginal/artifacts/python-run.log
          grep -F "AIM_MARGINAL_OK" \
            formal/aim_single_marginal/artifacts/python-run.log

      - name: Record generated-code checksums
        shell: bash
        run: |
          set -euxo pipefail
          find formal/aim_single_marginal/artifacts/aim_marginal-py \
            -type f -print0 | sort -z | xargs -0 sha256sum \
            > formal/aim_single_marginal/artifacts/generated-sha256.txt

      - name: Upload proof and generated Python
        uses: actions/upload-artifact@v4
        with:
          name: dafny-aim-single-marginal
          path: |
            formal/aim_single_marginal/AimSingleMarginal.dfy
            formal/aim_single_marginal/README.md
            formal/aim_single_marginal/artifacts/
          if-no-files-found: error
