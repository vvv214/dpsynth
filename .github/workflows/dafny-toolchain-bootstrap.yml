name: Dafny toolchain bootstrap
on:
  push:
    branches: [experiment/dafny-dp-foundation]
    paths: [.github/workflows/dafny-toolchain-bootstrap.yml]
permissions:
  contents: read
jobs:
  fetch-official-toolchain:
    runs-on: ubuntu-22.04
    steps:
      - name: Download pinned official Dafny distribution
        run: |
          curl --fail --location --retry 2 \
            https://github.com/dafny-lang/dafny/releases/download/v4.11.0/dafny-4.11.0-x64-ubuntu-22.04.zip \
            -o dafny-4.11.0-x64-ubuntu-22.04.zip
          sha256sum dafny-4.11.0-x64-ubuntu-22.04.zip > sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dafny-pinned-toolchain
          path: |
            dafny-4.11.0-x64-ubuntu-22.04.zip
            sha256.txt
          compression-level: 0
          retention-days: 1
