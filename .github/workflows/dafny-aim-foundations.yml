name: Dafny AIM foundations pilot

on:
  push:
    branches:
      - experiment/dafny-aim-foundations
  workflow_dispatch:

jobs:
  verify-translate-run:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out experiment branch
        uses: actions/checkout@v4

      - name: Install Dafny 4.11.0
        uses: dafny-lang/setup-dafny-action@v1
        with:
          dafny-version: "4.11.0"

      - name: Record tool versions
        run: |
          set -euxo pipefail
          mkdir -p formal/aim_foundations/artifacts
          mkdir -p formal/aim_array_kernel/artifacts
          dafny --version | tee formal/aim_foundations/artifacts/dafny-version.txt
          python3 --version 2>&1 | tee formal/aim_foundations/artifacts/python-version.txt

      - name: Verify sequence-based foundations
        run: |
          set -o pipefail
          dafny verify formal/aim_foundations/AimFoundations.dfy \
            | tee formal/aim_foundations/artifacts/verify.log

      - name: Verify mutable array kernel
        run: |
          set -o pipefail
          dafny verify formal/aim_array_kernel/AimArrayKernel.dfy \
            | tee formal/aim_array_kernel/artifacts/verify.log

      - name: Translate verified programs to Python
        run: |
          set -euxo pipefail
          dafny translate py \
            formal/aim_foundations/AimFoundations.dfy \
            --output=formal/aim_foundations/artifacts/aim_foundations \
            --include-runtime \
            | tee formal/aim_foundations/artifacts/translate.log
          dafny translate py \
            formal/aim_array_kernel/AimArrayKernel.dfy \
            --output=formal/aim_array_kernel/artifacts/aim_array_kernel \
            --include-runtime \
            | tee formal/aim_array_kernel/artifacts/translate.log

      - name: Execute generated Python
        run: |
          set -euxo pipefail
          python3 formal/aim_foundations/artifacts/aim_foundations-py/ \
            | tee formal/aim_foundations/artifacts/python-run.log
          grep -F "AIM_FOUNDATIONS_OK" \
            formal/aim_foundations/artifacts/python-run.log
          grep -F "[[1, 2], [1, 1]]" \
            formal/aim_foundations/artifacts/python-run.log
          grep -F "7 2" \
            formal/aim_foundations/artifacts/python-run.log

          python3 formal/aim_array_kernel/artifacts/aim_array_kernel-py/ \
            | tee formal/aim_array_kernel/artifacts/python-run.log
          grep -F "AIM_ARRAY_OK" \
            formal/aim_array_kernel/artifacts/python-run.log
          grep -F "1 2 1 1" \
            formal/aim_array_kernel/artifacts/python-run.log

      - name: Record generated-code checksums
        run: |
          set -euxo pipefail
          find formal/aim_foundations/artifacts/aim_foundations-py \
            -type f -print0 | sort -z | xargs -0 sha256sum \
            > formal/aim_foundations/artifacts/generated-sha256.txt
          find formal/aim_array_kernel/artifacts/aim_array_kernel-py \
            -type f -print0 | sort -z | xargs -0 sha256sum \
            > formal/aim_array_kernel/artifacts/generated-sha256.txt

      - name: Upload proofs and generated Python
        uses: actions/upload-artifact@v4
        with:
          name: dafny-aim-foundations
          path: |
            formal/aim_foundations/
            formal/aim_array_kernel/
          if-no-files-found: error
