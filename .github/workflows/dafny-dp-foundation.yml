name: Dafny DP foundation pilot
on:
  push:
    branches: [experiment/dafny-dp-foundation]
    paths:
      - formal/dp_foundation/**
      - .github/workflows/dafny-dp-foundation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-translate-run:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dafny-lang/setup-dafny-action@v1
        with: {dafny-version: "4.11.0"}
      - name: Verify all sources, translate, execute, reject negative cases
        run: bash formal/dp_foundation/run.sh
      - name: Archive sources and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dafny-flat-user-pipeline
          path: formal/dp_foundation/
          if-no-files-found: error
